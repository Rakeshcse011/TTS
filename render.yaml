services:
  - type: web
    name: audiogen-ai
    runtime: python
    plan: starter
    region: oregon
    buildCommand: python -m pip install uv && uv sync --locked --no-dev --extra edge
    startCommand: uv run --no-sync streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: AUDIOGEN_TTS_PROVIDER
        value: edge
      - key: AUDIOGEN_DATA_DIR
        value: /var/data/audiogen-ai
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
    disk:
      name: audiogen-ai-data
      mountPath: /var/data
      sizeGB: 1
